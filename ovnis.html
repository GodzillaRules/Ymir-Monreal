<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVNIS — Ymir Monreal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'DM Mono', monospace;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }

    .back-link {
      position: fixed;
      top: 2rem;
      left: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>

  <a class="back-link" href="index.html">← Volver</a>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    });

    // ── Estrellas ──
    const NUM_STARS = 300;
    let stars = [];

    function initStars() {
      stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.3,
          alpha: Math.random() * 0.6 + 0.4,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function drawStars(t) {
      stars.forEach(s => {
        const alpha = s.alpha * (0.7 + 0.3 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      });
    }

    // ── OVNIs ──
    const NUM_OVNIS = 5;
    const OVNI_COLORS = [
      ['#a0c4ff', '#6a9fd8'],
      ['#caffbf', '#7ec87b'],
      ['#ffd6a5', '#e0a060'],
      ['#ffadad', '#d46b6b'],
      ['#c9b1ff', '#9a7dd4'],
    ];

    function createOvni(i) {
      const w = 80 + Math.random() * 40;
      const h = w * 0.4;
      const speed = 1.2 + Math.random() * 1.8;
      const dx = (Math.random() > 0.5 ? 1 : -1) * speed;
      const dy = (Math.random() > 0.5 ? 1 : -1) * speed * (Math.random() * 0.6 + 0.2);
      const colors = OVNI_COLORS[i % OVNI_COLORS.length];
      return {
        x: Math.random() * (canvas.width - w) + w / 2,
        y: Math.random() * (canvas.height - h) + h / 2,
        w, h, dx, dy,
        color1: colors[0],
        color2: colors[1],
        lightAngle: 0,
        lightSpeed: 0.04 + Math.random() * 0.03
      };
    }

    let ovnis = [];
    function initOvnis() {
      ovnis = [];
      for (let i = 0; i < NUM_OVNIS; i++) {
        ovnis.push(createOvni(i));
      }
    }

    function drawOvni(o) {
      const { x, y, w, h } = o;

      ctx.save();
      ctx.translate(x, y);

      // Sombra suave
      ctx.shadowColor = o.color1;
      ctx.shadowBlur = 18;

      // Cuerpo principal (elipse)
      ctx.beginPath();
      ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = o.color2;
      ctx.fill();

      // Cúpula superior
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.15, w * 0.28, h * 0.55, 0, Math.PI, 0);
      ctx.fillStyle = o.color1;
      ctx.fill();

      // Franja central
      ctx.beginPath();
      ctx.ellipse(0, 0, w / 2, h * 0.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();

      // Luces parpadeantes debajo
      const numLights = 5;
      for (let i = 0; i < numLights; i++) {
        const angle = (i / numLights) * Math.PI * 2 + o.lightAngle;
        const lx = Math.cos(angle) * w * 0.32;
        const ly = Math.sin(angle) * h * 0.18 + h * 0.15;
        const brightness = 0.5 + 0.5 * Math.sin(o.lightAngle * 3 + i * 1.2);
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,180,${brightness})`;
        ctx.shadowColor = 'rgba(255,255,150,0.8)';
        ctx.shadowBlur = 6;
        ctx.fill();
      }

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function updateOvni(o) {
      o.x += o.dx;
      o.y += o.dy;
      o.lightAngle += o.lightSpeed;

      // Rebotar en los bordes (estilo DVD)
      if (o.x - o.w / 2 <= 0) { o.x = o.w / 2; o.dx = Math.abs(o.dx); }
      if (o.x + o.w / 2 >= canvas.width) { o.x = canvas.width - o.w / 2; o.dx = -Math.abs(o.dx); }
      if (o.y - o.h / 2 <= 0) { o.y = o.h / 2; o.dy = Math.abs(o.dy); }
      if (o.y + o.h / 2 >= canvas.height) { o.y = canvas.height - o.h / 2; o.dy = -Math.abs(o.dy); }
    }

    // ── Loop principal ──
    initStars();
    initOvnis();

    function loop(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStars(t * 0.001);

      ovnis.forEach(o => {
        updateOvni(o);
        drawOvni(o);
      });

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>

</body>
</html>
